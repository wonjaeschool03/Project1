<!DOCTYPE html>
<html>

<head>
    <title>Ineffable</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://use.typekit.net/qcx7uzw.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="font-container">
        <div id="halo"></div>
        <h1 class="adobe-font" id="ineffable-text">Ineffable</h1>
    </div>

    <script>
        const text = document.getElementById("ineffable-text");
        const halo = document.getElementById("halo");

        text.addEventListener("click", function () {
            halo.classList.remove("sunrise");
            void halo.offsetWidth;
            halo.classList.add("sunrise");
        });
    </script>

</body>

</html>
